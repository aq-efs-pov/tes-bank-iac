# Intentionally misconfigured for demo purposes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: insecure-web }
  template:
    metadata:
      labels: { app: insecure-web }
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: web
          image: nginx:latest
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
          ports:
            - containerPort: 80
